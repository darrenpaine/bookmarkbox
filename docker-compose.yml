services:
  bookmarkbox:
    build: .
    restart: unless-stopped
    ports:
      - "${BIND_ADDRESS:-127.0.0.1}:${HOST_PORT:-4000}:4000"
    env_file:
      - path: .env
        required: false
    environment:
      # Fixed inside the container. Use HOST_PORT to change the published port.
      PORT: "4000"
      DATABASE_PATH: /data/bookmarkbox.db
    volumes:
      - data:/data

volumes:
  data:
